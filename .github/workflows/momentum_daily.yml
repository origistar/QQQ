name: 动量ETF前十跟踪-每日
on:
  schedule:
    - cron: '15 14 * * *'   # 北京时间 22:15 每日
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance
      - name: 抓取最新并渲染
        run: python momentum_daily.py
      - name: 提交更新
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add momentum_changes.html momentum_snapshots.json
          git diff --staged --quiet || (git commit -m "📊 动量ETF跟踪每日更新 $(date +'%Y-%m-%d')" && git push)
